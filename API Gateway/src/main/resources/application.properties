server.port=${API_GATEWAY_PORT:8080}

spring.application.name=api-gateway

# ═══════════════════════════════════════════════════════════════════════════════════
# JWT Configuration
# ═══════════════════════════════════════════════════════════════════════════════════
jwt.secret=${JWT_SECRET:SportsCenterSystemSecretKeyForJWTTokenDevelopmentOnly2026}

# ═══════════════════════════════════════════════════════════════════════════════════
# Internal endpoints security (used by User Service to revoke tokens on logout)
# ═══════════════════════════════════════════════════════════════════════════════════
security.internal.secret=${INTERNAL_SECRET:CHANGE_ME_INTERNAL_SECRET_DEV_ONLY}

# ═══════════════════════════════════════════════════════════════════════════════════
# Rate limiting on /api/auth/login (per-IP, fixed window)
# ═══════════════════════════════════════════════════════════════════════════════════
security.ratelimit.login.enabled=${RATE_LIMIT_ENABLED:true}
security.ratelimit.login.max-requests=${RATE_LIMIT_MAX:5}
security.ratelimit.login.window-seconds=${RATE_LIMIT_WINDOW:60}

# ═══════════════════════════════════════════════════════════════════════════════════
# ROUTES - USER SERVICE (Auth & User Management)
# ═══════════════════════════════════════════════════════════════════════════════════
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=http://${USER_SERVICE_HOST:localhost}:${USER_SERVICE_PORT:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**,/api/auth/**
spring.cloud.gateway.routes[0].filters[0]=JwtAuthenticationFilter

# ═══════════════════════════════════════════════════════════════════════════════════
# ROUTES - BOOKING SERVICE
# ═══════════════════════════════════════════════════════════════════════════════════
spring.cloud.gateway.routes[1].id=booking-service
spring.cloud.gateway.routes[1].uri=http://${BOOKING_SERVICE_HOST:localhost}:${BOOKING_SERVICE_PORT:8083}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/bookings/**
spring.cloud.gateway.routes[1].filters[0]=JwtAuthenticationFilter

# ═══════════════════════════════════════════════════════════════════════════════════
# ROUTES - PAYMENT SERVICE
# ═══════════════════════════════════════════════════════════════════════════════════
spring.cloud.gateway.routes[2].id=payment-service
spring.cloud.gateway.routes[2].uri=http://${PAYMENT_SERVICE_HOST:localhost}:${PAYMENT_SERVICE_PORT:8084}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/payments/**
spring.cloud.gateway.routes[2].filters[0]=JwtAuthenticationFilter

# ═══════════════════════════════════════════════════════════════════════════════════
# ROUTES - RESOURCE SERVICE
# ═══════════════════════════════════════════════════════════════════════════════════
spring.cloud.gateway.routes[3].id=resource-service
spring.cloud.gateway.routes[3].uri=http://${RESOURCE_SERVICE_HOST:localhost}:${RESOURCE_SERVICE_PORT:8082}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/resources/**
spring.cloud.gateway.routes[3].filters[0]=JwtAuthenticationFilter

# ═══════════════════════════════════════════════════════════════════════════════════
# Service Discovery (Eureka)
# ═══════════════════════════════════════════════════════════════════════════════════
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}:${random.value}

# ═══════════════════════════════════════════════════════════════════════════════════
# Actuator & Logging
# ═══════════════════════════════════════════════════════════════════════════════════
management.endpoints.web.exposure.include=health,info,metrics,gateway
management.endpoint.health.show-details=always
management.endpoint.gateway.enabled=true

logging.level.ba.nwt.apigateway=INFO
logging.level.org.springframework.cloud.gateway=INFO
