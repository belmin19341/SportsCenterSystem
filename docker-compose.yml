services:

  # ═══════════════════════════════════════════════════════════════════════════
  # INFRASTRUCTURE — databases and message broker
  # ═══════════════════════════════════════════════════════════════════════════

  mysql-user:
    image: mysql:8.0
    container_name: sportcenter-user-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${USER_DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${USER_DB_PORT}:3306"
    volumes:
      - user-db-data:/var/lib/mysql
    networks:
      - sportcenter-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-resource:
    image: mysql:8.0
    container_name: sportcenter-resource-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${RESOURCE_DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${RESOURCE_DB_PORT}:3306"
    volumes:
      - resource-db-data:/var/lib/mysql
    networks:
      - sportcenter-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-booking:
    image: mysql:8.0
    container_name: sportcenter-booking-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${BOOKING_DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${BOOKING_DB_PORT}:3306"
    volumes:
      - booking-db-data:/var/lib/mysql
    networks:
      - sportcenter-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-payment:
    image: mysql:8.0
    container_name: sportcenter-payment-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${PAYMENT_DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${PAYMENT_DB_PORT}:3306"
    volumes:
      - payment-db-data:/var/lib/mysql
    networks:
      - sportcenter-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: sportcenter-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - sportcenter-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ═══════════════════════════════════════════════════════════════════════════
  # PLATFORM — config and service discovery (start before microservices)
  # ═══════════════════════════════════════════════════════════════════════════

  config-server:
    build:
      context: ./config-server
    image: sportcenter/config-server
    container_name: sportcenter-config-server
    ports:
      - "${CONFIG_SERVER_PORT:-8888}:8888"
    environment:
      CONFIG_REPO_PATH: /config-repo
    volumes:
      - ./config-repo:/config-repo:ro
    networks:
      - sportcenter-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 45s

  discovery-server:
    build:
      context: ./discovery-server
    image: sportcenter/discovery-server
    container_name: sportcenter-discovery-server
    ports:
      - "${DISCOVERY_SERVER_PORT:-8761}:8761"
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - sportcenter-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 45s

  # ═══════════════════════════════════════════════════════════════════════════
  # MICROSERVICES — all depend on discovery-server being healthy
  # ═══════════════════════════════════════════════════════════════════════════

  user-service:
    build:
      context: ./User Service
    image: sportcenter/user-service
    container_name: sportcenter-user-service
    ports:
      - "${USER_SERVICE_PORT:-8081}:8081"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: user-service
      USER_DB_URL: jdbc:mysql://mysql-user:3306/${USER_DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      JWT_ISSUER: ${JWT_ISSUER:-sports-center-user-service}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-sports-center-api}
      JWT_KID: ${JWT_KID:-sports-key-1}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-900}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-CHANGE_ME_INTERNAL_SECRET_DEV_ONLY}
      JPA_HIBERNATE_DDL_AUTO: ${JPA_HIBERNATE_DDL_AUTO:-update}
    depends_on:
      mysql-user:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - sportcenter-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  resource-service:
    build:
      context: ./Resource Service
    image: sportcenter/resource-service
    container_name: sportcenter-resource-service
    ports:
      - "${RESOURCE_SERVICE_PORT:-8082}:8082"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: resource-service
      RESOURCE_DB_URL: jdbc:mysql://mysql-resource:3306/${RESOURCE_DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JPA_HIBERNATE_DDL_AUTO: ${JPA_HIBERNATE_DDL_AUTO:-update}
    depends_on:
      mysql-resource:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - sportcenter-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  booking-service:
    build:
      context: ./Booking Service
    image: sportcenter/booking-service
    container_name: sportcenter-booking-service
    ports:
      - "${BOOKING_SERVICE_PORT:-8083}:8083"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: booking-service
      BOOKING_DB_URL: jdbc:mysql://mysql-booking:3306/${BOOKING_DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      JPA_HIBERNATE_DDL_AUTO: ${JPA_HIBERNATE_DDL_AUTO:-update}
    depends_on:
      mysql-booking:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - sportcenter-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  payment-service:
    build:
      context: ./Payment Service
    image: sportcenter/payment-service
    container_name: sportcenter-payment-service
    ports:
      - "${PAYMENT_SERVICE_PORT:-8084}:8084"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: payment-service
      PAYMENT_DB_URL: jdbc:mysql://mysql-payment:3306/${PAYMENT_DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      JPA_HIBERNATE_DDL_AUTO: ${JPA_HIBERNATE_DDL_AUTO:-update}
    depends_on:
      mysql-payment:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - sportcenter-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ═══════════════════════════════════════════════════════════════════════════
  # API GATEWAY — routes traffic to microservices via Eureka
  # ═══════════════════════════════════════════════════════════════════════════

  api-gateway:
    build:
      context: ./API Gateway
    image: sportcenter/api-gateway
    container_name: sportcenter-api-gateway
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: api-gateway
      USER_SERVICE_HOST: user-service
      USER_SERVICE_PORT: 8081
      BOOKING_SERVICE_HOST: booking-service
      BOOKING_SERVICE_PORT: 8083
      PAYMENT_SERVICE_HOST: payment-service
      PAYMENT_SERVICE_PORT: 8084
      JWT_ISSUER: ${JWT_ISSUER:-sports-center-user-service}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-sports-center-api}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-CHANGE_ME_INTERNAL_SECRET_DEV_ONLY}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-5}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-60}
      FRONTEND_ALLOWED_ORIGINS: ${FRONTEND_ALLOWED_ORIGINS:-http://localhost:80,http://localhost:3000,http://localhost:5173}
    depends_on:
      discovery-server:
        condition: service_healthy
    networks:
      - sportcenter-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ═══════════════════════════════════════════════════════════════════════════
  # FRONTEND — React SPA served via nginx
  # ═══════════════════════════════════════════════════════════════════════════

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    image: sportcenter/frontend
    container_name: sportcenter-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - sportcenter-net

volumes:
  user-db-data:
  resource-db-data:
  booking-db-data:
  payment-db-data:
  rabbitmq-data:

networks:
  sportcenter-net:
    driver: bridge
