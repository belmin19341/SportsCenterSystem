# Local fallback values (mirror config-repo/user-service-dev.properties).
# Spring Cloud Config (when reachable) overrides these.

server.port=${USER_SERVICE_PORT:8081}

spring.application.name=user-service

spring.datasource.url=${USER_DB_URL:jdbc:mysql://localhost:3307/sportcenter_user_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:sportcenter}
spring.datasource.password=${DB_PASSWORD:sportcenter123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.stat=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.ba.nwt.userservice=DEBUG

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:127.0.0.1}
eureka.instance.instance-id=${spring.application.name}:${server.port}:${random.value}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT Configuration (RS256 — private key is held ONLY by the User Service)
jwt.algorithm=RS256
jwt.private-key-path=classpath:keys/jwt-private.pem
jwt.public-key-path=classpath:keys/jwt-public.pem
jwt.issuer=${JWT_ISSUER:sports-center-user-service}
jwt.audience=${JWT_AUDIENCE:sports-center-api}
jwt.kid=${JWT_KID:sports-key-1}
jwt.access.expiration=${JWT_ACCESS_EXPIRATION:900}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:604800}

# ── RabbitMQ ──────────────────────────────────────────────────────────────────
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}
spring.rabbitmq.virtual-host=/
