# ── Test Configuration — H2 In-Memory ──
server.port=0

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false;MODE=MYSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.main.allow-bean-definition-overriding=true

# ── Disable external services ──
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.discovery.enabled=false
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false
spring.config.import=optional:configserver:

# ── JWT (RS256 — uses repo-bundled test keys on classpath) ──
jwt.algorithm=RS256
jwt.private-key-path=classpath:keys/jwt-private.pem
jwt.public-key-path=classpath:keys/jwt-public.pem
jwt.issuer=sports-center-user-service
jwt.audience=sports-center-api
jwt.access.expiration=900
jwt.refresh.expiration=604800

# ── Disable RabbitMQ in unit/slice tests ──────────────────────────────────────
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration



