server.port=${USER_SERVICE_PORT:8081}

spring.datasource.url=${USER_DB_URL:jdbc:mysql://localhost:3307/sportcenter_user_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:sportcenter}
spring.datasource.password=${DB_PASSWORD:sportcenter123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.stat=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ── JWT Configuration (RS256 — asymmetric) ──────────────────────────────────
# Private key is loaded ONLY by the User Service (the sole token issuer).
# Public key is loaded both locally (for refresh-token validation) and by
# the API Gateway (for inbound request validation). The private key is NEVER
# shared with other microservices.
jwt.algorithm=RS256
jwt.private-key-path=${JWT_PRIVATE_KEY_PATH:file:./keys/jwt-private.pem}
jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:file:./keys/jwt-public.pem}
jwt.issuer=${JWT_ISSUER:sports-center-user-service}
jwt.audience=${JWT_AUDIENCE:sports-center-api}
jwt.kid=${JWT_KID:sports-key-1}
jwt.access.expiration=${JWT_ACCESS_EXPIRATION:900}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:604800}

# ── Gateway revoke endpoint (used by /api/auth/logout) ───────────────
security.gateway.internal-revoke-url=${GATEWAY_INTERNAL_REVOKE_URL:http://localhost:8080/internal/revoke}
security.internal.secret=${INTERNAL_SECRET:CHANGE_ME_INTERNAL_SECRET_DEV_ONLY}
