# API Gateway Service Configuration (Development)
server.port=${API_GATEWAY_PORT:8080}

spring.application.name=api-gateway

# ═══════════════════════════════════════════════════════════════════════════════════
# JWT Configuration (RS256 — gateway holds the PUBLIC key only)
# ═══════════════════════════════════════════════════════════════════════════════════
jwt.algorithm=RS256
jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:file:./keys/jwt-public.pem}
jwt.issuer=${JWT_ISSUER:sports-center-user-service}
jwt.audience=${JWT_AUDIENCE:sports-center-api}

# ═══════════════════════════════════════════════════════════════════════════════════
# Internal endpoints security (used by User Service to revoke tokens on logout)
# ═══════════════════════════════════════════════════════════════════════════════════
security.internal.secret=${INTERNAL_SECRET:CHANGE_ME_INTERNAL_SECRET_DEV_ONLY}

# ═══════════════════════════════════════════════════════════════════════════════════
# Rate limiting on /api/auth/login (per-IP, fixed window)
# ═══════════════════════════════════════════════════════════════════════════════════
security.ratelimit.login.enabled=${RATE_LIMIT_ENABLED:true}
security.ratelimit.login.max-requests=${RATE_LIMIT_MAX:5}
security.ratelimit.login.window-seconds=${RATE_LIMIT_WINDOW:60}
frontend.allowed-origins=${FRONTEND_ALLOWED_ORIGINS:http://localhost,http://127.0.0.1,http://localhost:80,http://127.0.0.1:80,http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000,http://localhost:4200,http://127.0.0.1:4200,http://localhost:8080,http://127.0.0.1:8080}

# ═══════════════════════════════════════════════════════════════════════════════════
# ROUTES - USER SERVICE (Auth & User Management)
# ═══════════════════════════════════════════════════════════════════════════════════
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://${USER_SERVICE_HOST:localhost}:${USER_SERVICE_PORT:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/**,/api/auth/**,/api/loyalty/**,/api/achievements/**,/api/user-achievements/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=JwtAuthenticationFilter

# ═══════════════════════════════════════════════════════════════════════════════════
# ROUTES - BOOKING SERVICE
# ═══════════════════════════════════════════════════════════════════════════════════
spring.cloud.gateway.server.webflux.routes[1].id=booking-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://${BOOKING_SERVICE_HOST:localhost}:${BOOKING_SERVICE_PORT:8083}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/bookings/**,/api/rentals/**,/api/reviews/**,/api/booking-users/**,/api/lb-demo/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=JwtAuthenticationFilter

# ═══════════════════════════════════════════════════════════════════════════════════
# ROUTES - PAYMENT SERVICE
# ═══════════════════════════════════════════════════════════════════════════════════
spring.cloud.gateway.server.webflux.routes[2].id=payment-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://${PAYMENT_SERVICE_HOST:localhost}:${PAYMENT_SERVICE_PORT:8084}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/payments/**,/api/notifications/**,/api/documents/**,/api/disputes/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=JwtAuthenticationFilter

# ═══════════════════════════════════════════════════════════════════════════════════
# ROUTES - RESOURCE SERVICE
# ═══════════════════════════════════════════════════════════════════════════════════
spring.cloud.gateway.server.webflux.routes[3].id=resource-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://resource-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/resources/**,/api/facilities/**,/api/equipment/**,/api/pricing-rules/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=JwtAuthenticationFilter

# ═══════════════════════════════════════════════════════════════════════════════════
# Service Discovery (Eureka)
# ═══════════════════════════════════════════════════════════════════════════════════
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:127.0.0.1}
eureka.instance.instance-id=${spring.application.name}:${server.port}:${random.value}

# ═══════════════════════════════════════════════════════════════════════════════════
# Actuator & Logging
# ═══════════════════════════════════════════════════════════════════════════════════
management.endpoints.web.exposure.include=health,info,metrics,gateway
management.endpoint.health.show-details=always
management.endpoint.gateway.access=read-only

logging.level.ba.nwt.apigateway=INFO
logging.level.org.springframework.cloud.gateway=INFO
